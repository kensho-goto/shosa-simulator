<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0907">
<meta name="robots" content="noindex">
<title>所作シミュレーター（仮題）</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@700;800&display=swap">
<link rel="stylesheet" href="src/style.css">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three-build/three.module.js",
  "three/addons/": "./vendor/three-addons/"
} }
</script>
</head>
<body>
<canvas id="view"></canvas>

<!-- 遊んでいる間の表示 -->
<div id="hud">
  <div id="chapter"></div>
  <div id="mood"><span class="lbl">空気</span><div class="bar"><i></i></div></div>
  <div id="meter" hidden><div class="track"><b class="zone"></b><i class="needle"></i></div><span class="cap"></span></div>
  <div id="objective"></div>
  <div id="subtitle"></div>
  <div id="choices"></div>
  <div id="keys"></div>
  <div id="toast"></div>
  <div id="gauge" hidden><span class="cap"></span><div class="track"><b class="danger"></b><b class="good"></b><b class="best"></b><i class="needle"></i></div></div>
  <div id="stamp"></div>
</div>

<!-- スマホの操作（その場面で使うものだけ出る） -->
<div id="touch" class="off">
  <button id="pauseBtn" aria-label="一時停止"><i></i><i></i></button>
  <div id="thint"></div>
  <div id="stick" hidden><i></i></div>
  <div id="tsmall"></div>
  <div id="tbtns"></div>
</div>

<!-- 合言葉 -->
<div id="gate" hidden><div>
  <h1>所作<br>シミュレーター</h1>
  <p>合言葉を入れてください</p>
  <input id="gateInput" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="合言葉">
  <p id="gateMsg">&nbsp;</p>
  <button id="gateBtn">はいる</button>
</div></div>

<!-- スマホを縦にしているとき -->
<div id="rotate"><div><b>⟲</b><p>スマホを横にして遊んでください</p></div></div>

<!-- タイトル -->
<section id="title" class="screen">
  <div class="logo">
    <small>仮題</small>
    <h1><span class="w l1"><span class="o">所作</span><span class="f">所作</span></span><br><span class="w l2"><span class="o">シミュレーター</span><span class="f">シミュレーター</span></span></h1>
    <p class="tag">礼儀正しくするほど、大事件になる。</p>
  </div>
  <nav>
    <button data-act="story">はじめる<span>第一章　親への結婚挨拶</span></button>
    <button data-act="rush">お茶の間60秒<span>気配りが、同時に押しよせる</span></button>
    <button data-act="select">場面をえらぶ</button>
    <button data-act="zukan">珍事ずかん</button>
    <button data-act="settings">設定</button>
  </nav>
  <p class="foot">試作版 v0.2 ・ 動きと音は仮の素材です</p>
</section>

<!-- 場面・チェックポイントえらび -->
<section id="select" class="screen" hidden>
  <h2>場面をえらぶ</h2>
  <div id="selectList"></div>
  <button class="back" data-act="back">もどる</button>
</section>

<!-- 珍事ずかん -->
<section id="zukan" class="screen" hidden>
  <h2>珍事ずかん</h2>
  <div id="zukanList"></div>
  <button class="back" data-act="back">もどる</button>
</section>

<!-- 設定 -->
<section id="settings" class="screen" hidden>
  <h2>設定</h2>
  <label>字幕の大きさ <select data-set="subSize"><option value="s">小</option><option value="m">中</option><option value="l">大</option></select></label>
  <label>マウスの感度 <input type="range" min="0.4" max="2" step="0.1" data-set="sens"></label>
  <label>操作 <select data-set="controls"><option value="easy">かんたん（押すだけ）</option><option value="pro">こだわり（マウス・キーを使い分ける）</option></select></label>
  <label>操作の手助け <select data-set="assist"><option value="0">なし</option><option value="1">あり（向きが合いやすい・こぼれにくい）</option></select></label>
  <label>見た目 <select data-set="style"><option value="toon">アニメ風</option><option value="real">写実</option></select></label>
  <label>画質 <select data-set="quality"><option value="high">きれい</option><option value="low">かるい</option></select></label>
  <label>音の大きさ <input type="range" min="0" max="1" step="0.05" data-set="vol"></label>
  <button class="back" data-act="back">もどる</button>
</section>

<!-- 一時停止 -->
<section id="pause" class="screen dim" hidden>
  <h2>一時停止</h2>
  <nav>
    <button data-act="resume">つづける</button>
    <button data-act="retryStep">このところからやり直す</button>
    <button data-act="settings">設定</button>
    <button data-act="quit">タイトルへ</button>
  </nav>
</section>

<!-- 結果 -->
<section id="result" class="screen dim" hidden>
  <h2 id="resTitle"></h2>
  <div id="resGrid"></div>
  <div id="resFinds"></div>
  <nav>
    <button data-act="again">もう一度</button>
    <button data-act="select">ところを選んでやり直す</button>
    <button data-act="quit">タイトルへ</button>
  </nav>
</section>

<div id="loading">読み込み中…</div>
<script type="module" src="src/main.js"></script>
<script src="src/gate.js"></script>
</body>
</html>
